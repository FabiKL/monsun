name: host-tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware/tests/host -B build/host
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
